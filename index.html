<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TJ's Hero Lab</title>
  <meta name="theme-color" content="#10131C">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script>
</head>
<body data-screen="start">

  <!-- ───────── start ───────── -->
  <section id="start" class="screen start" aria-labelledby="startTitle">
    <div class="burst" aria-hidden="true"></div>
    <div class="start-body">
      <p class="kicker">TJ's</p>
      <h1 id="startTitle" class="title">Hero<br>Lab</h1>
      <button id="goBtn" class="big primary go" type="button"><span class="ico" aria-hidden="true">🦸🏿‍♂️</span> Suit up!</button>
      <button id="startGallery" class="text-btn" type="button"><span aria-hidden="true">🖼️</span> My hero pictures</button>
    </div>
  </section>

  <!-- ───────── studio ───────── -->
  <section id="studio" class="screen studio" aria-label="Hero lab">
    <div class="stage" id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="canvas" aria-label="Camera with hero gear"></canvas>

      <div class="topbar">
        <button id="homeBtn" class="chip" type="button" aria-label="Back to start"><span aria-hidden="true">‹</span> Home</button>
        <div class="brand" aria-hidden="true">TJ'S HERO LAB</div>
        <button id="flipBtn" class="chip" type="button" aria-label="Switch camera"><span aria-hidden="true">🔄</span> Flip</button>
      </div>

      <div id="powerHint" class="power-hint" aria-live="polite" hidden></div>
      <div id="hint" class="hint" role="status" hidden></div>
      <div id="count" class="count" aria-live="assertive" hidden></div>
      <div id="flash" class="flash" hidden></div>

      <div id="loading" class="overlay" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p id="loadingText">Powering up…</p>
      </div>
      <div id="error" class="overlay" role="alert" hidden>
        <div class="err-ico" aria-hidden="true">🙈</div>
        <p id="errTitle" class="err-title">Uh-oh!</p>
        <p id="errText" class="err-text"></p>
        <button id="retryBtn" class="big primary" type="button">Try again</button>
      </div>
    </div>

    <footer class="dock">
      <div class="tabs" role="tablist" aria-label="Drawers">
        <button class="tab" role="tab" data-tab="masks" type="button"><span class="tab-ico" aria-hidden="true">🦸🏿‍♂️</span> Masks</button>
        <button class="tab" role="tab" data-tab="powers" type="button"><span class="tab-ico" aria-hidden="true">⚡</span> Powers</button>
        <button class="tab" role="tab" data-tab="gear" type="button"><span class="tab-ico" aria-hidden="true">🛡️</span> Gear</button>
        <button class="tab" role="tab" data-tab="looks" type="button"><span class="tab-ico" aria-hidden="true">🎨</span> Looks</button>
      </div>
      <div id="tray" class="tray" role="tabpanel"></div>
      <div class="shutter-row">
        <button id="galleryBtn" class="side-btn" type="button" aria-label="My hero pictures">
          <span class="thumb" id="thumb"><span aria-hidden="true">🖼️</span></span><span class="side-label">Pictures</span>
        </button>
        <button id="shutter" class="shutter" type="button" aria-label="Take a picture"><span class="shutter-core" aria-hidden="true">📸</span></button>
        <button id="clearBtn" class="side-btn" type="button" aria-label="Take everything off">
          <span class="thumb" aria-hidden="true">🧺</span><span class="side-label">All off</span>
        </button>
      </div>
    </footer>
  </section>

  <!-- ───────── gallery ───────── -->
  <section id="gallery" class="sheet" aria-label="My hero pictures" hidden>
    <header class="sheet-head">
      <h2>My Hero Pictures</h2>
      <button id="galleryClose" class="chip" type="button">Done</button>
    </header>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>No pictures yet!<br><span aria-hidden="true">📸</span> Tap the big button.</p>
  </section>

  <section id="viewer" class="sheet viewer" aria-label="Picture" hidden>
    <img id="viewerImg" alt="A hero picture">
    <div class="viewer-actions">
      <button id="viewerBack" class="big primary" type="button">‹ Back</button>
      <button id="shareBtn" class="big secondary" type="button"><span aria-hidden="true">💌</span> Share</button>
      <button id="trashBtn" class="big secondary" type="button" aria-label="Throw away"><span aria-hidden="true">🗑️</span></button>
    </div>
  </section>

  <div id="confirm" class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmText" hidden>
    <div class="modal-card">
      <p id="confirmText">Throw this picture away?</p>
      <div class="modal-actions">
        <button id="keepBtn" class="big primary" type="button"><span aria-hidden="true">⭐</span> Keep it</button>
        <button id="tossBtn" class="big secondary" type="button"><span aria-hidden="true">🗑️</span> Throw away</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
